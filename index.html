<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3F Woordenschat Battle</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #eef2f7; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-img { width: 100%; height: auto; border-radius: 8px; border: 3px solid #3498db; margin-bottom: 20px; display: block; }
        .hidden { display: none; }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-top: 0; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; }
        .admin-btn { background: #95a5a6; }
        .reset-btn { background: #e74c3c; }
        .score-list { background: #f8f9fa; padding: 15px; border-left: 5px solid #3498db; margin-top: 20px; }
        #target-word { font-size: 50px; color: #e74c3c; margin: 10px 0; text-transform: uppercase; font-weight: 800; text-align: center; }
        .meaning-box { background: #fff3cd; padding: 15px; border-radius: 6px; font-style: italic; border: 1px solid #ffeeba; margin-top: 10px; }
        #role-status { font-weight: bold; padding: 15px; border-radius: 6px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <img src="woordenschatbattle.png" alt="Woordenschat Battle" class="header-img">

    <div id="login-screen">
        <h2>Inloggen Student</h2>
        <input type="text" id="username" placeholder="Je voornaam...">
        <select id="userclass">
            <option value="Delta">Klas Delta</option>
            <option value="Echo">Klas Echo</option>
            <option value="Foxtrot">Klas Foxtrot</option>
            <option value="Lima">Klas Lima</option>
            <option value="Mike">Klas Mike</option>
        </select>
        <button onclick="login()">Start Spel</button>
        <button class="admin-btn" onclick="showAdmin()">Docent Dashboard (Bulk)</button>
    </div>

    <div id="admin-screen" class="hidden">
        <h2>Bulk Invoer</h2>
        <p>Formaat: <strong>woord[SPATIE]betekenis</strong></p>
        <textarea id="bulk-input" rows="10" placeholder="Aanzienlijk erg groot of veel"></textarea>
        <button onclick="saveWords()">Lijst Opslaan & Start</button>
        <button class="reset-btn" onclick="resetDatabase()">DATABASE RESETTEN</button>
        <button onclick="location.reload()">Terug</button>
    </div>

    <div id="game-screen" class="hidden">
        <h3 id="welcome-msg"></h3>
        <div id="role-status">Wachten op spelers...</div>
        <hr>
        
        <div id="describer-view" class="hidden">
            <div style="background: #fdf2f2; border: 2px dashed #e74c3c; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
                <h4 style="margin: 0; color: #e74c3c;">⚠️ OPDRACHT:</h4>
                <p style="margin: 5px 0;"><strong>Je mag het woord zelf niet noemen!</strong><br>Leg aan de klas uit wat het woord betekent.</p>
            </div>
            <p style="text-align:center; margin-bottom: 5px;">Jouw woord is:</p>
            <div id="target-word">---</div>
            <div class="meaning-box">
                <strong>Hulpmiddel (de betekenis):</strong> <br>
                <span id="target-meaning"></span>
            </div>
        </div>

        <div id="guesser-view" class="hidden">
            <p>Raad het woord:</p>
            <input type="text" id="guess-input" placeholder="Typ je antwoord...">
            <button onclick="checkGuess()">Verstuur</button>
        </div>

        <hr>
        <h4>Tussenstand:</h4>
        <div id="score-display" class="score-list"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCJ5of6K5MRFXMOiEqEyZxZbs1xoJtXuN8",
        authDomain: "pvaangifteinleveren.firebaseapp.com",
        databaseURL: "https://pvaangifteinleveren-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "pvaangifteinleveren",
        storageBucket: "pvaangifteinleveren.firebasestorage.app",
        messagingSenderId: "989190242332",
        appId: "1:989190242332:web:867ea95845325cf9835fd9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let myClass = "";

    function showAdmin() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
    }

    function login() {
        myName = document.getElementById('username').value.trim();
        myClass = document.getElementById('userclass').value;
        if(!myName) return alert("Naam verplicht!");

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('welcome-msg').innerText = `Speler: ${myName} (${myClass})`;

        db.ref('players/' + myName).set({ name: myName, class: myClass, score: 0, hasDescribed: false });
        
        checkGameStart();
        listenToGame();
    }

    function checkGameStart() {
        db.ref('players').once('value', snap => {
            const players = snap.val();
            if (players && Object.keys(players).length >= 2) {
                db.ref('currentRound').once('value', rSnap => {
                    if(!rSnap.exists()) pickNewRound(true);
                });
            }
        });
    }

    function saveWords() {
        const text = document.getElementById('bulk-input').value;
        const lines = text.split('\n');
        let words = [];
        lines.forEach(line => {
            const t = line.trim();
            const spaceIdx = t.indexOf(' ');
            if(spaceIdx !== -1) words.push({ w: t.substring(0, spaceIdx), m: t.substring(spaceIdx).trim() });
        });
        if(words.length > 0) {
            db.ref('wordlist').set(words);
            db.ref('roundCount').set(0);
            alert("Woorden geladen!");
        }
    }

    function pickNewRound(forceNew = false) {
        db.ref('/').once('value', snap => {
            const data = snap.val();
            if(!data.wordlist) return;
            
            let rCount = data.roundCount || 0;
            let describer = data.currentRound ? data.currentRound.describer : null;

            if (forceNew || rCount % 5 === 0) {
                const available = Object.keys(data.players).filter(p => !data.players[p].hasDescribed);
                if (available.length === 0) {
                    Object.keys(data.players).forEach(p => db.ref(`players/${p}/hasDescribed`).set(false));
                    describer = Object.keys(data.players)[0]; 
                } else {
                    describer = available[Math.floor(Math.random() * available.length)];
                }
                db.ref(`players/${describer}/hasDescribed`).set(true);
            }

            const randW = data.wordlist[Math.floor(Math.random() * data.wordlist.length)];
            db.ref('currentRound').set({ word: randW.w, meaning: randW.m, describer: describer });
            db.ref('roundCount').set(rCount + 1);
        });
    }

    function listenToGame() {
        db.ref('players').on('value', snap => {
            const data = snap.val();
            let h = "";
            for(let p in data) h += `<div>${data[p].name} (${data[p].class}): <strong>${data[p].score}</strong> ${data[p].hasDescribed?'✓':''}</div>`;
            document.getElementById('score-display').innerHTML = h;
        });

        db.ref('currentRound').on('value', snap => {
            const r = snap.val();
            if(!r) return;
            const isD = (r.describer === myName);
            const sBox = document.getElementById('role-status');
            sBox.style.background = isD ? "#e74c3c" : "#27ae60";
            sBox.style.color = "white";
            sBox.innerText = isD ? "JIJ BENT DE OMSCHRIJVER" : `${r.describer} omschrijft...`;
            
            document.getElementById('describer-view').classList.toggle('hidden', !isD);
            document.getElementById('guesser-view').classList.toggle('hidden', isD);
            if(isD) {
                document.getElementById('target-word').innerText = r.word;
                document.getElementById('target-meaning').innerText = r.meaning;
            } else {
                document.getElementById('guess-input').value = "";
                document.getElementById('guess-input').focus();
            }
        });
    }

    function checkGuess() {
        const g = document.getElementById('guess-input').value.trim().toLowerCase();
        db.ref('currentRound/word').once('value', snap => {
            if(g === snap.val().toLowerCase()) {
                db.ref('players/' + myName + '/score').transaction(s => (s || 0) + 3);
                pickNewRound(false);
            } else alert("Fout!");
        });
    }

    function resetDatabase() {
        if(confirm("Alles wissen?")) { db.ref('/').remove(); location.reload(); }
    }
</script>

</body>
</html>
